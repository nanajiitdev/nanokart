spring.application.name=inventory-service

server.port=8086

# ==========================
# PostgreSQL Configuration
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ==========================
# JPA Configuration
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Eureka Configuration
# ==========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=192.168.1.49
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ==========================
# Actuator
# ==========================
management.endpoints.web.exposure.include=*

logging.level.org.springframework.web=INFO



#########################################
# Kafka Configuration
#########################################

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=inventory-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.value.default.type=com.user.login.inventory.event.PaymentCompletedEvent


#########################################
# Kafka Producer Configuration
#########################################

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

####################################################
# OpenFeign
####################################################

spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000


management.tracing.enabled=true
management.tracing.sampling.probability=1.0

logging.pattern.correlation=[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]
spring.reactor.context-propagation=auto
